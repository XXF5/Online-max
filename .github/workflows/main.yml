name:  Auto Cycle

on:
  schedule:
    # كل ساعة؛ يتم التحقق من توقيت مصر داخل الخطوات
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bot-cycle
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 135

    env:
      TZ: Africa/Cairo

    steps:
      - name: Check Egypt Time
        id: schedule
        run: |
          HOUR=$(date +%H)

          echo "Egypt time: $(date)"
          echo "Current hour: $HOUR"

          # فترتان يوميًا، كل فترة ساعتان
          WORK_HOURS="09 10 21 22"

          if [[ " $WORK_HOURS " == *" $HOUR "* ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Inside working hours."
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Outside working hours."
          fi

      - name: Checkout Public Repository
        if: steps.schedule.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Checkout Private Repository
        if: steps.schedule.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: BXF8/PX
          token: ${{ secrets.GH_TOKEN }}
          path: private

      - name: Set up Docker Buildx
        if: steps.schedule.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        if: steps.schedule.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./private
          tags: telegram-bot:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Bot for Two Hours
        if: steps.schedule.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm \
            --init \
            -e TZ=Africa/Cairo \
            telegram-bot:latest \
            bash -c '
              set -u

              echo "Starting Telegram bot..."
              python -u main.py &
              BOT_PID=$!

              stop_bot() {
                echo "Stopping bot..."
                kill -TERM "$BOT_PID" 2>/dev/null || true

                for i in $(seq 1 20); do
                  kill -0 "$BOT_PID" 2>/dev/null || break
                  sleep 1
                done

                kill -KILL "$BOT_PID" 2>/dev/null || true
                wait "$BOT_PID" 2>/dev/null || true
              }

              trap stop_bot EXIT TERM INT

              END=$((SECONDS + 7200))

              while [ "$SECONDS" -lt "$END" ]; do
                if ! kill -0 "$BOT_PID" 2>/dev/null; then
                  echo "Bot stopped unexpectedly."
                  wait "$BOT_PID"
                  exit $?
                fi

                sleep 10
              done

              echo "Two hours completed."
            '
