name: Bot Cycle 6

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: bot-cycle-6
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 160

    env:
      TZ: Africa/Cairo
      WORK_HOURS: "09 10 21 22"

    steps:
      - name: Check Egypt Time
        run: |
          HOUR=$(date +%H)

          echo "Egypt time: $(date)"
          echo "Current hour: $HOUR"
          echo "Allowed hours: $WORK_HOURS"

          case " $WORK_HOURS " in
            *" $HOUR "*)
              echo "Inside working hours."
              ;;
            *)
              echo "Outside working hours."
              exit 78
              ;;
          esac

      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: BXF8/PX
          token: ${{ secrets.GH_TOKEN }}
          path: private

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./private
          tags: telegram-bot:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Bot
        run: |
          docker run --rm \
            -e TZ=Africa/Cairo \
            -e WORK_HOURS="$WORK_HOURS" \
            telegram-bot:latest \
            bash -c '
              python main.py &
              BOT_PID=$!
              END=$((SECONDS + 7200))

              cleanup() {
                kill "$BOT_PID" 2>/dev/null || true
                wait "$BOT_PID" 2>/dev/null || true
              }

              trap cleanup EXIT TERM INT

              while [ "$SECONDS" -lt "$END" ]; do
                sleep 15

                if ! kill -0 "$BOT_PID" 2>/dev/null; then
                  echo "Bot stopped unexpectedly."
                  wait "$BOT_PID"
                  exit $?
                fi

                HOUR=$(date +%H)

                case " $WORK_HOURS " in
                  *" $HOUR "*)
                    ;;
                  *)
                    echo "Outside working hours. Stopping bot."
                    exit 0
                    ;;
                esac
              done

              echo "Two-hour run completed."
            '
