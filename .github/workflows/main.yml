name: Auto Cycle

on:
schedule:
- cron: "0 * * * *"
workflow_dispatch:

permissions:
contents: read

concurrency:
group: telegram-bot-cycle
cancel-in-progress: false

jobs:
run-bot:
runs-on: ubuntu-latest
timeout-minutes: 135

env:
  TZ: Africa/Cairo

steps:
  # ==========================================
  # تحديد أوقات التشغيل بتوقيت مصر
  # ==========================================

  - name: Check Egypt Time
    id: schedule
    shell: bash
    run: |
      set -euo pipefail

      HOUR=$(date +%H)

      echo "Egypt time: $(date)"
      echo "Current hour: $HOUR"

      WORK_HOURS="09 10 21 22"

      if [[ " $WORK_HOURS " == *" $HOUR "* ]]; then
        echo "allowed=true" >> "$GITHUB_OUTPUT"
        echo "Inside working hours."

      elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
        echo "allowed=true" >> "$GITHUB_OUTPUT"
        echo "Manual start enabled."

      else
        echo "allowed=false" >> "$GITHUB_OUTPUT"
        echo "Outside working hours."
      fi

  # ==========================================
  # تحميل المستودع العام
  # ==========================================

  - name: Checkout Public Repository
    if: steps.schedule.outputs.allowed == 'true'
    uses: actions/checkout@v4

  # ==========================================
  # تحميل المستودع الخاص
  # ==========================================

  - name: Checkout Private Repository
    if: steps.schedule.outputs.allowed == 'true'
    uses: actions/checkout@v4
    with:
      repository: BXF8/PX
      token: ${{ secrets.GH_TOKEN }}
      path: private

  # ==========================================
  # التحقق من الملفات
  # ==========================================

  - name: Verify Files
    if: steps.schedule.outputs.allowed == 'true'
    shell: bash
    run: |
      set -euo pipefail

      test -f private/Dockerfile || {
        echo "[ERROR] Dockerfile not found"
        exit 1
      }

      test -f private/start.sh || {
        echo "[ERROR] start.sh not found"
        exit 1
      }

      for file in \
        private/bots/bot1.py \
        private/bots/bot2.py \
        private/bots/bot3.py \
        private/bots/bot4.py \
        private/bots/bot5.py \
        private/bots/main.py
      do
        if [[ ! -f "$file" ]]; then
          echo "[ERROR] Missing bot file: $file"
          exit 1
        fi
      done

      echo "All six bot files found."

      echo "----- Dockerfile -----"
      cat private/Dockerfile

      echo "----- start.sh -----"
      sed -n '1,240p' private/start.sh

  # ==========================================
  # إعداد Docker
  # ==========================================

  - name: Set up Docker Buildx
    if: steps.schedule.outputs.allowed == 'true'
    uses: docker/setup-buildx-action@v3

  # ==========================================
  # بناء صورة Docker
  # ==========================================

  - name: Build Docker Image
    if: steps.schedule.outputs.allowed == 'true'
    uses: docker/build-push-action@v6
    with:
      context: ./private
      file: ./private/Dockerfile
      tags: telegram-bot:latest
      load: true
      cache-from: type=gha
      cache-to: type=gha,mode=max

  # ==========================================
  # تشغيل البوتات الستة لمدة ساعتين
  # ==========================================

  - name: Run start.sh for Two Hours
    if: steps.schedule.outputs.allowed == 'true'
    shell: bash
    run: |
      set -Eeuo pipefail

      CONTAINER_NAME="telegram-bot-cycle"

      cleanup() {
        echo "[Manager] Stopping container..."

        docker stop --time 20 "$CONTAINER_NAME" 2>/dev/null || true
        docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
      }

      trap cleanup EXIT

      docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

      echo "[Manager] Starting start.sh..."

      # تشغيل start.sh مباشرة بدل الاعتماد على CMD في Dockerfile
      docker run -d \
        --name "$CONTAINER_NAME" \
        --init \
        -e TZ=Africa/Cairo \
        telegram-bot:latest \
        bash /app/start.sh

      echo "[Manager] Container started."
      echo "[Manager] Expected bots: bot1 bot2 bot3 bot4 bot5 main"
      echo "[Manager] Runtime: 2 hours."

      # متابعة سجلات الحاوية
      docker logs -f "$CONTAINER_NAME" &
      LOG_PID=$!

      END=$((SECONDS + 7200))

      while (( SECONDS < END )); do
        RUNNING=$(docker inspect \
          --format '{{.State.Running}}' \
          "$CONTAINER_NAME" 2>/dev/null || echo false)

        if [[ "$RUNNING" != "true" ]]; then
          echo "[ERROR] Container stopped unexpectedly."

          docker logs "$CONTAINER_NAME" 2>&1 || true

          kill "$LOG_PID" 2>/dev/null || true
          wait "$LOG_PID" 2>/dev/null || true

          exit 1
        fi

        sleep 10
      done

      echo "[Manager] Two hours completed."

      kill "$LOG_PID" 2>/dev/null || true
      wait "$LOG_PID" 2>/dev/null || true

      docker logs --tail 150 "$CONTAINER_NAME" 2>&1 || true

      cleanup
      trap - EXIT

      echo "[Manager] Container stopped successfully."
